# Verificaciones que corren antes de cada commit.
# Son las mismas que ejecuta el pipeline, para no descubrir en el servidor
# algo que se pudo detectar en la maquina del desarrollador.
#
# Instalacion, una sola vez por integrante:
#   pip install pre-commit
#   pre-commit install

repos:
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        args: [--line-length=100]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=100]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
